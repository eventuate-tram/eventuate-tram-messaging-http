apply plugin: 'java-library'
apply plugin: 'org.springframework.boot'

dependencies {
    api project(":eventuate-tram-consumer-http-common")

    api "io.eventuate.tram.core:eventuate-tram-spring-consumer-kafka:$eventuateTramVersion"
    api "io.eventuate.tram.core:eventuate-tram-events:$eventuateTramVersion"
    api "io.eventuate.tram.core:eventuate-tram-commands:$eventuateTramVersion"

    api "org.springframework.boot:spring-boot-starter:$springBootVersion"
    api "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    api "org.springframework.boot:spring-boot-starter-webmvc:$springBootVersion"
    api "org.springframework.boot:spring-boot-starter-aspectj:$springBootVersion"
    api "org.springframework.boot:spring-boot-starter-jdbc:$springBootVersion"

    implementation "org.apache.curator:curator-recipes:$curatorVersion"
    implementation "org.apache.commons:commons-lang3:$commonsLang3Version"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc-test:$springBootVersion"
    testImplementation "io.eventuate.util:eventuate-util-test:$eventuateUtilVersion"

    testImplementation "io.eventuate.tram.core:eventuate-tram-spring-producer-jdbc:$eventuateTramVersion"
    testImplementation "io.eventuate.tram.core:eventuate-tram-spring-events-publisher:$eventuateTramVersion"
    testImplementation "io.eventuate.tram.core:eventuate-tram-spring-commands:$eventuateTramVersion"

    testRuntimeOnly "com.mysql:mysql-connector-j:$mysqlConnectorVersion"
}

configurations {
    [apiElements, runtimeElements].each {
        it.outgoing.artifacts.removeIf {
            it.buildDependencies.getDependencies(null).contains(jar)
        }
        it.outgoing.artifact(bootJar)
    }
}

publish.dependsOn(tasks.named('bootJar'))

test {
    forkEvery 1
}
